name: Neon Dynasty - Official Engine Execution

on:
  workflow_dispatch:
    inputs:
      math_sdk_ref:
        description: "Engine Math SDK ref"
        required: true
        default: "main"
      web_sdk_ref:
        description: "Engine Web SDK ref"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  official-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Neon Dynasty
        uses: actions/checkout@v4
        with:
          path: game

      - name: Source layout preflight
        working-directory: game
        run: |
          python3 tools/official_layout_preflight.py

      - name: Checkout official Math SDK
        uses: actions/checkout@v4
        with:
          repository: engineio/math-sdk
          ref: ${{ inputs.math_sdk_ref }}
          path: .vendor/math-sdk

      - name: Checkout official Web SDK
        uses: actions/checkout@v4
        with:
          repository: engineio/web-sdk
          ref: ${{ inputs.web_sdk_ref }}
          path: .vendor/web-sdk

      - name: Record SDK revisions
        run: |
          {
            echo "Math SDK revision:"
            git -C .vendor/math-sdk rev-parse HEAD
            echo
            echo "Web SDK revision:"
            git -C .vendor/web-sdk rev-parse HEAD
          } | tee sdk-revisions.txt

      - name: Verify SDK compatibility
        working-directory: game
        run: |
          python3 tools/official_sdk_compatibility_preflight.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Install Math SDK dependencies
        working-directory: .vendor/math-sdk
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install -e .
          fi

      - name: Install Neon Dynasty into official Math SDK
        run: |
          rm -rf .vendor/math-sdk/games/neon_dynasty
          mkdir -p .vendor/math-sdk/games/neon_dynasty
          cp -a game/math/neon_dynasty/. .vendor/math-sdk/games/neon_dynasty/

      - name: Run official Math pipeline
        working-directory: .vendor/math-sdk
        run: |
          python games/neon_dynasty/run.py

      - name: Verify official completion
        run: |
          grep -Rqs "OFFICIAL_PIPELINE_COMPLETE" .vendor/math-sdk

      - name: Locate publication
        id: publication
        run: |
          set -e

          if [ -d ".vendor/math-sdk/games/neon_dynasty/library/publish_files" ]; then
            PUB=".vendor/math-sdk/games/neon_dynasty/library/publish_files"
          elif [ -d ".vendor/math-sdk/library/publish_files" ]; then
            PUB=".vendor/math-sdk/library/publish_files"
          else
            echo "No official publication directory found."
            exit 1
          fi

          echo "PUB=$PUB" >> "$GITHUB_OUTPUT"
          echo "Publication: $PUB"

      - name: Verify publication
        run: |
          python3 game/tools/verify_publication.py \
            "${{ steps.publication.outputs.PUB }}"

      - name: Engine publication preflight
        run: |
          python3 game/tools/engine_publication_preflight.py \
            "${{ steps.publication.outputs.PUB }}"

      - name: Install Neon Dynasty into official Web SDK
        run: |
          rm -rf .vendor/web-sdk/apps/neon-dynasty
          mkdir -p .vendor/web-sdk/apps/neon-dynasty
          cp -a game/web/neon-dynasty/. \
            .vendor/web-sdk/apps/neon-dynasty/

      - name: Enable pnpm
        working-directory: .vendor/web-sdk
        run: |
          corepack enable
          corepack prepare pnpm@10.5.0 --activate
          pnpm --version

      - name: Install Web SDK dependencies
        working-directory: .vendor/web-sdk
        run: |
          pnpm install --frozen-lockfile

      - name: Build Neon Dynasty frontend
        working-directory: .vendor/web-sdk
        run: |
          pnpm run build --filter=neon-dynasty

      - name: Collect release evidence
        working-directory: game
        run: |
          python3 ci/collect_release_evidence.py \
            "../${{ steps.publication.outputs.PUB }}" \
            "../release-evidence/release-evidence.json"

      - name: Package official build
        run: |
          rm -rf release-package
          mkdir -p release-package/math

          cp -a "${{ steps.publication.outputs.PUB }}/." \
            release-package/math/

          if [ -d ".vendor/web-sdk/apps/neon-dynasty/dist" ]; then
            mkdir -p release-package/web
            cp -a .vendor/web-sdk/apps/neon-dynasty/dist/. \
              release-package/web/
          elif [ -d ".vendor/web-sdk/apps/neon-dynasty/build" ]; then
            mkdir -p release-package/web
            cp -a .vendor/web-sdk/apps/neon-dynasty/build/. \
              release-package/web/
          else
            echo "No frontend dist/build directory found."
            exit 1
          fi

          cp sdk-revisions.txt release-package/

      - name: Upload official build
        uses: actions/upload-artifact@v4
        with:
          name: neon-dynasty-official-build
          path: |
            release-package
            release-evidence
            sdk-revisions.txt
          if-no-files-found: error
