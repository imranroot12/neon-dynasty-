name: Neon Dynasty Official Execution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner test
        run: |
          echo "NEON DYNASTY RUNNER ONLINE"
          python3 --version
          node --version
          cargo --version

      - name: Verify Neon Dynasty source
        run: |
          test -f math/neon_dynasty/run.py
          test -f math/neon_dynasty/game_config.py
          test -f math/neon_dynasty/gamestate.py
          test -f web/neon-dynasty/package.json
          echo "NEON DYNASTY SOURCE VERIFIED"
