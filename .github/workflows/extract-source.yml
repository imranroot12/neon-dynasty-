name: Extract Neon Dynasty Source

on:
  push:
    paths:
      - "neon_dynasty_source_79.zip"
      - ".github/workflows/extract-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source package
        run: |
          python3 - <<'PY'
          import shutil
          import zipfile
          from pathlib import Path

          archive = Path("neon_dynasty_source_79.zip")
          temp = Path(".tmp_neon")

          with zipfile.ZipFile(archive) as z:
              z.extractall(temp)

          for item in temp.iterdir():
              if item.name == ".github":
                  continue
              target = Path(item.name)
              if target.exists():
                  if target.is_dir():
                      shutil.copytree(item, target, dirs_exist_ok=True)
                  else:
                      shutil.copy2(item, target)
              else:
                  if item.is_dir():
                      shutil.copytree(item, target)
                  else:
                      shutil.copy2(item, target)

          shutil.rmtree(temp)
          archive.unlink()
          PY

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Neon Dynasty source package" || exit 0
          git push
